version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# A single-page app must serve index.html for unknown paths, or deep links
# (/?ref=CODE, /?checkout=success) return 404.
customRules:
  - source: '/<*>'
    target: '/index.html'
    status: '200'
