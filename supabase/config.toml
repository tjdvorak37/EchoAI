project_id = "echoai"

[auth]
site_url = "https://www.echoaipro.com"
additional_redirect_urls = [
	"https://www.echoaipro.com/**",
	"https://echoaipro.com/**",
	"https://www.echoaipro.com/?recovery=1",
	"https://echoaipro.com/?recovery=1",
]

[auth.email]
# EchoAI sends confirmation, recovery, and invitation messages through its
# server-side Support email provider instead of Supabase's built-in mailer.
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Google and Facebook sign-in return "Unsupported provider: provider is not
# enabled" until both of these blocks are enabled AND the referenced secrets
# exist. This config alone does not turn the providers on — you must also:
#   1. Create a Google OAuth client (console.cloud.google.com) and a Facebook
#      Login app (developers.facebook.com), each with authorized redirect URI
#      https://<project-ref>.supabase.co/auth/v1/callback
#   2. supabase secrets set AUTH_GOOGLE_CLIENT_ID=... AUTH_GOOGLE_CLIENT_SECRET=... \
#        AUTH_FACEBOOK_CLIENT_ID=... AUTH_FACEBOOK_CLIENT_SECRET=...
#   3. supabase config push (or toggle+save the equivalent fields in
#      Authentication -> Providers in the Supabase dashboard, which achieves
#      the same result without the CLI).
[auth.external.google]
enabled = true
client_id = "env(AUTH_GOOGLE_CLIENT_ID)"
secret = "env(AUTH_GOOGLE_CLIENT_SECRET)"

[auth.external.facebook]
enabled = true
client_id = "env(AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(AUTH_FACEBOOK_CLIENT_SECRET)"

[functions.stripe-webhook]
# Stripe signs requests itself; it cannot present a Supabase JWT.
verify_jwt = false

[functions.create-checkout-session]
# Buyers check out before they have an account.
verify_jwt = false

[functions.billing-portal]
verify_jwt = true

[functions.mfa-recover]
# The caller has lost their second factor and cannot present an AAL2 JWT.
verify_jwt = false

[functions.ai-image]
verify_jwt = true

[functions.inhouse-ai]
verify_jwt = true

[functions.listening-fetch]
verify_jwt = true

[functions.cloud-drive]
# Handles the OAuth redirect back from Google and Microsoft, which arrives
# without a Supabase JWT. Requests are authorised inside the function.
verify_jwt = false

[functions.social-oauth]
# OAuth providers redirect here without a Supabase JWT. The function validates
# the stored, single-use state before completing the authenticated user's flow.
verify_jwt = false

[functions.public-support-ticket]
# Public support intake validates and rate-limits requests inside the function.
verify_jwt = false

[functions.support-ticket-reply]
verify_jwt = true

[functions.support-ticket-inbound]
# Microsoft 365 / Power Automate authenticates with SUPPORT_INBOUND_WEBHOOK_SECRET.
verify_jwt = false

[functions.password-reset-request]
# Password recovery is public, but the function uses generic responses and hashed throttling.
verify_jwt = false

[functions.send-auth-email]
# Auth links are generated server-side and delivered through Support email.
verify_jwt = false

[functions.social-publisher]
# The trusted scheduler authenticates with SOCIAL_PUBLISHER_CRON_SECRET rather
# than a Supabase user JWT.
verify_jwt = false
