project_id = "echoai"

[functions.stripe-webhook]
# Stripe signs requests itself; it cannot present a Supabase JWT.
verify_jwt = false

[functions.create-checkout-session]
# Buyers check out before they have an account.
verify_jwt = false

[functions.billing-portal]
verify_jwt = true

[functions.mfa-recover]
# The caller has lost their second factor and cannot present an AAL2 JWT.
verify_jwt = false

[functions.ai-image]
verify_jwt = true

[functions.inhouse-ai]
verify_jwt = true

[functions.listening-fetch]
verify_jwt = true

[functions.cloud-drive]
# Handles the OAuth redirect back from Google and Microsoft, which arrives
# without a Supabase JWT. Requests are authorised inside the function.
verify_jwt = false

[functions.social-oauth]
# OAuth providers redirect here without a Supabase JWT. The function validates
# the stored, single-use state before completing the authenticated user's flow.
verify_jwt = false

[functions.public-support-ticket]
# Public support intake validates and rate-limits requests inside the function.
verify_jwt = false

[functions.social-publisher]
# The trusted scheduler authenticates with SOCIAL_PUBLISHER_CRON_SECRET rather
# than a Supabase user JWT.
verify_jwt = false
